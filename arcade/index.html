<style>

{

  ob(2.9, 0.16, 1.75, darkWood, -4.35, 3.5, -0.78);                          // the balcony floor
  ob(2.9, 0.3, 0.12, wood, -4.35, 3.35, 0.08);                               // its fascia
  ob(2.7, 2.1, 0.12, darkWood, -4.45, 4.62, -1.0);                            // the office's front wall
  const win = canvasTex(512, 256, (g, w, h) => {                              // the window: warm light, mullions, a figure at a desk
    const r = g.createLinearGradient(0, 0, 0, h); r.addColorStop(0, '#ffcf8a'); r.addColorStop(1, '#ff8a3a'); g.fillStyle = r; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(70,30,10,.55)'; g.fillRect(300, 150, 150, 40); g.beginPath(); g.arc(360, 120, 22, 0, 7); g.fill(); g.fillRect(340, 140, 40, 40);

  });
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 1.35), new THREE.MeshBasicMaterial({ map: planet, transparent: true, color: HOT(0xffffff, 1.6), toneMapped: false, depthWrite: false }));
