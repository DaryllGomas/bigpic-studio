<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Veyr: The Gate Road</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l1.4 5.6L15 8l-5.6 1.4L8 15l-1.4-5.6L1 8l5.6-1.4z%22 fill=%22%23d4b06a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #04050a; overflow: hidden; }
  canvas#view { display: block; width: 100vw; height: 100vh; outline: none; }
  /* the only words on screen: a small title card that fades on its own */
  #card { position: fixed; left: 50%; top: 13%; transform: translateX(-50%); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 2.6s ease; color: #f1dcaa; user-select: none; }
  #card.on { opacity: 1; }
  #card .t { font: 600 17px/1 'Cinzel', 'Times New Roman', serif; letter-spacing: .34em; padding-left: .34em;
    text-shadow: 0 0 18px rgba(212,176,106,.45), 0 1px 0 rgba(0,0,0,.6); }
  #card .rule { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px auto 10px; width: 190px; }
  #card .rule i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #d4b06a 40%, #d4b06a 60%, transparent); opacity: .8; }
  #card .rule b { width: 9px; height: 9px; background: #f1dcaa; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    filter: drop-shadow(0 0 4px #d4b06a); }
  #fade { position: fixed; inset: 0; background: #04050a; pointer-events: none; transition: opacity 2.2s ease; }
  #fade.off { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #card, #fade { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Atlas Veyr, the gate road at dusk"></canvas>
<div id="card" aria-hidden="true">
  <div class="t">ATLAS VEYR</div>
  <div class="rule"><i></i><b></b><i></i></div>
</div>
<div id="fade"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
